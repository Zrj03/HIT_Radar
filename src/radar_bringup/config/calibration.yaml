%YAML:1.0

# 1. 相机内参矩阵 (3x3)
# 相机内参矩阵 K_0，将归一化相机坐标变换到像素坐标
# 矩阵格式:
#   [ fx  0  cx ]
#   [ 0  fy  cy ]
#   [ 0   0   1 ]
# 参数含义:
#   fx, fy: 相机焦距 (单位: 像素)
#   cx, cy: 相机主点 (单位: 像素) 
camera_intrinsic: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [2599.59, 0.0, 1528.51,
          0.0, 2599.33, 1005.63,
          0.0, 0.0, 1.0]

# 2. 相机畸变系数 (1x5)
# 相机镜头畸变系数，用于消除镜头畸变
# 畸变模型: p_distorted = p_undistorted + distortion_offset
# 参数格式: [k1, k2, p1, p2, k3]
#   k1, k2, k3: 径向畸变系数 (radial distortion) - 消除筒形/枕形畸变
#   p1, p2: 切向畸变系数 (tangential distortion) - 消除由镜头偏心引起的畸变
camera_distortion: !!opencv-matrix
   rows: 1
   cols: 5
   dt: d
   data: [-0.0827, 0.1738,
          -0.0004, 0.0004,
          -0.0805]

# 3. 外参变换矩阵 (4x4) 
# 定义LiDAR坐标系到相机坐标系的刚体变换（旋转 + 平移）实现点云与图像的空间配准
# 变换公式:
#   p_camera = E_0 * p_lidar = [R t; 0 1] * [p; 1]
#   其中 R 为 3x3 旋转矩阵, t 为 3x1 平移向量
# 矩阵结构 (4x4 齐次变换矩阵):
#   [ R(0,0) R(0,1) R(0,2) | t_x ]
#   [ R(1,0) R(1,1) R(1,2) | t_y ]
#   [ R(2,0) R(2,1) R(2,2) | t_z ]
#   [   0      0      0    |  1  ]
lidar_to_camera: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [-0.144803521036, -0.988547148422, -0.042504146786,  1.577576803440,
           0.066681217285,  0.033108422960, -0.997222910711, -0.345022408538,
           0.987209200877, -0.147235160052,  0.061154337612,  0.351822366156,
           0.0,             0.0,             0.0,             1.0]
