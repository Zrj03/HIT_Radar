/radar/pc_aligner:
  ros__parameters:
    sample_lidar: 'lidar_mid70'
    # 初始化采样点云数目
    init_sample: 1000000
    # 对齐器采样模型点数
    mesh_sample: 1000000
    # 自动配准预处理：按角度栅格保留每个方向最远点，参考 T-DT_Radar localization
    auto_align.use_angular_farthest: True
    auto_align.angular_grid_deg: 0.1
    # T-DT_Radar 风格自动配准：角度最远点 -> ROI -> 0.1m 体素降采样 -> GICP
    auto_align.voxel_size: 0.1
    auto_align.backend: "pcl_gicp"
    auto_align.flatten_z: False
    # 对齐器裁剪盒 单位: m
    crop_box.min: [5.0, -10.0, -5.0]
    crop_box.max: [30.0, 8.0, 7.0]
    # 最大对应点距离 单位: m
    max_corr_dist: 3.5
    # 最大迭代次数
    max_iteration: 65
    # TF 续发周期：缩短缓存边界，降低extrapolation风险
    tf_pub_interval_ms: 100
    # 质量门槛：最小拟合率
    quality_gate.enable: True
    quality_gate.max_rmse: 0.45
    quality_gate.min_fitness: 0.70

    # Initial lidar->middle guess from measured national stand pose:
    # world lidar pose ~= [x=0.0, y=7.5, z=3.985], yaw=0 (facing +X).
    init_trans: [0.0, -8.0, -3.985, 1.0, 0.0, 0.0, 0.0]

    # 启用预选择点
    use_preselect: False
    # 启动时跳过点云手动选点，直接使用自动配准
    startup_manual_align: False

    vis_auto: False

    manual_crop.min: [0., -1., -2.]
    manual_crop.max: [28., 16., 3.]

    align_model: "pointcloud"
    pointcloud: "RM2026.pcd"
    # RM2026.pcd原始跨度约291.5 x 160.5 x 36.98，缩放0.1后对应29.15m x 16.05m x 3.70m
    pointcloud_scale: 0.1
    pointcloud_yaw: 0.0
    pointcloud_translation: [14.575, -1.624340057, 1.841340065]
    mesh: "rm_2026_19M.stl"
    mesh_scale: 0.00096

